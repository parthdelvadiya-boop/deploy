{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="card">

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your account to manage tasks.
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="button">
                Create Account
            </button>

        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="{% url 'login' %}">
                Login
            </a>
        </p>

    </div>

</div>

{% endblock %}
