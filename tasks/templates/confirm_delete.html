{% extends "base.html" %}

{% block title %}Delete Task{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="card">

        <h1>Delete Task?</h1>

        <p>
            Are you sure you want to delete
            <strong>{{ task.title }}</strong>?
        </p>

        <form method="post">

            {% csrf_token %}

            <button type="submit" class="button danger">
                Yes, Delete
            </button>

            <a href="{% url 'task_list' %}" class="button secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
