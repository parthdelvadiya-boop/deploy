{% extends "base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}

<div class="form-container">

    <div class="card">

        <h1>{{ page_title }}</h1>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-actions">

                <button type="submit" class="button">
                    {{ button_text }}
                </button>

                <a href="{% url 'task_list' %}" class="button secondary">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
